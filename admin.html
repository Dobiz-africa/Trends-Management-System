<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendsDesk — Admin: Manage Accounts</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:system-ui,sans-serif;background:#0a0f1c;color:#e8ecf3;margin:0;padding:2rem}
  .wrap{max-width:720px;margin:0 auto}
  h1{color:#f0a500}
  label{display:block;margin-top:1rem;font-size:.85rem;color:#aab3c5}
  input,select{width:100%;box-sizing:border-box;padding:.6rem;margin-top:.3rem;background:#11172a;border:1px solid #2a3350;border-radius:6px;color:#e8ecf3}
  button{margin-top:1.5rem;padding:.7rem 1.4rem;background:#f0a500;border:none;border-radius:6px;color:#0a0f1c;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;margin-top:1rem}
  th,td{text-align:left;padding:.5rem;border-bottom:1px solid #2a3350;font-size:.85rem}
  #msg{margin-top:1rem;font-size:.85rem}
  #gate{padding:3rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate">Checking access…</div>

  <div id="panel" style="display:none">
    <h1>Manage Worker Accounts</h1>
    <p style="color:#aab3c5">Create a login for a linesman, finance, or managing director user. They'll sign in with the email/password you set here, then can change their password from the login screen's "Forgot password?" link.</p>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="worker@example.com">

    <label for="role">Role</label>
    <select id="role">
      <option value="">Select role…</option>
      <option value="linesman">Linesman</option>
      <option value="finance">Finance</option>
      <option value="md">Managing Director</option>
    </select>

    <button id="createBtn" onclick="generateInvite()">Generate Invite Link</button>
    <div id="msg"></div>
    <div id="linkBox" style="display:none;margin-top:1rem;padding:.8rem;background:#11172a;border:1px solid #2a3350;border-radius:6px;word-break:break-all;font-size:.8rem"></div>

    <h1 style="font-size:1.1rem;margin-top:2.5rem">Existing Accounts</h1>
    <table id="userTable">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
      <tbody id="userRows"></tbody>
    </table>

    <button style="background:transparent;border:1px solid #2a3350;color:#e8ecf3;margin-top:2rem" onclick="location.href='index.html'">← Back to TrendsDesk</button>
  </div>
</div>

<script>
let sb, session;

async function init(){
  const res = await fetch('/api/config');
  const cfg = await res.json();
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  const { data } = await sb.auth.getSession();
  session = data?.session;

  if(!session){
    document.getElementById('gate').textContent = 'Please sign in on the main app first, then come back to this page.';
    return;
  }

  const { data: me } = await sb.from('users').select('is_admin,role').eq('id', session.user.id).single();
  if(!(me?.is_admin || me?.role === 'admin')){
    document.getElementById('gate').textContent = 'This page is admin-only.';
    return;
  }

  document.getElementById('gate').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadUsers();
}

async function loadUsers(){
  const { data } = await sb.from('users').select('full_name,email,role').order('email');
  const rows = document.getElementById('userRows');
  rows.innerHTML = '';
  (data||[]).forEach(u=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${u.full_name||''}</td><td>${u.email}</td><td>${u.role}</td>`;
    rows.appendChild(tr);
  });
}

async function generateInvite(){
  const email = document.getElementById('email').value.trim();
  const role = document.getElementById('role').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('createBtn');
  const linkBox = document.getElementById('linkBox');

  if(!email || !role){ msg.textContent = 'Fill in email and role.'; return; }

  btn.disabled = true;
  msg.textContent = 'Generating…';
  linkBox.style.display = 'none';

  try{
    const { data, error } = await sb.from('invites').insert([{ email, role, created_by: session.user.id }]).select('token').single();
    if(error) throw error;

    const link = window.location.origin + '/invite.html?token=' + data.token;
    msg.style.color = '#7fdc9a';
    msg.textContent = 'Invite link created — copy it and send it to them:';
    linkBox.style.display = 'block';
    linkBox.textContent = link;
    document.getElementById('email').value = '';
    document.getElementById('role').value = '';
  }catch(e){
    msg.style.color = '#e57373';
    msg.textContent = 'Error: ' + e.message;
  }finally{
    btn.disabled = false;
  }
}

init();
</script>
</body>
</html>
